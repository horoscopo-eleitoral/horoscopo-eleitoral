name: Publicar no Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # 03:05 UTC = 00:05 em Brasília. Libera o horóscopo do dia.
    - cron: '5 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJETO: horoscopoeleitoral

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir segredos
        id: segredos
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CONTA" ]; then
            echo "::warning::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. Deploy no Cloudflare pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.segredos.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.segredos.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.segredos.outputs.ok == 'true'
      - run: npm run checar
        if: steps.segredos.outputs.ok == 'true'
      - run: npm run build
        if: steps.segredos.outputs.ok == 'true'
        env:
          TZ: America/Sao_Paulo
          SITE: https://${{ env.PROJETO }}.pages.dev
          BASE: /

      - name: Criar o projeto no Cloudflare (só na primeira vez)
        if: steps.segredos.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$PROJETO" --production-branch=main || echo "Projeto já existe."

      - name: Publicar
        if: steps.segredos.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name="$PROJETO" --branch=main --commit-dirty=true
