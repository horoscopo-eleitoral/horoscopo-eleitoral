name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 03:05 UTC = 00:05 em Brasília. Libera o horóscopo do dia.
    - cron: '5 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run checar
      - run: npm run build
        env:
          TZ: America/Sao_Paulo
          # O Pages do usuário responde em teles.dev.br; o projeto fica em /<repo>.
          # Com domínio próprio só para este site, troque SITE e deixe BASE como '/'.
          SITE: https://teles.dev.br
          BASE: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
